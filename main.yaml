name: Docker Build & Deploy

permissions:
  actions: read
  contents: read
  deployments: read
  id-token: write
  pull-requests: write

on:
  workflow_dispatch:
    inputs:
      ENVIRONMENT:
        description: 'Target environment'
        required: true
        default: 'non-prod' #########
        type: choice
        options:
          - prod
          - non-prod

jobs:
  BuildAndPushApplication:
    name: "[${{ inputs.ENVIRONMENT }}] build & push by [${{ github.actor }}]"
    runs-on: custom-runner   #####
    environment: ${{ inputs.ENVIRONMENT }}

    env:
      ask-id: 
      project-key: sample-project
      namespace: sample-ui
      JF_PUSH_URL: your-jfrog-registry.example.com
      JF_PULL_URL: your-edge-registry.example.com
      app-service: ${{ inputs.ENVIRONMENT == 'prod' && 'sample-ui-prod-app' || 'sample-ui-dev-app' }}
      resource-group: ${{ inputs.ENVIRONMENT == 'prod' && 'sample-prod-rg' || 'sample-dev-rg' }}
      dockerfile: Dockerfile

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Get Artifactory Access Token
        id: jf-saas-setup
        uses: org-name/jfrog-setup-action@v1
        with:
          jfrog-project-key: ${{ env.project-key }}

      - name: Login to Docker Push Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.JF_PUSH_URL }}
          username: ${{ steps.jf-saas-setup.outputs.oidc-subject }}
          password: ${{ steps.jf-saas-setup.outputs.access-token }}

      - name: Login to Docker Pull Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.JF_PULL_URL }}
          username: ${{ steps.jf-saas-setup.outputs.oidc-subject }}
          password: ${{ steps.jf-saas-setup.outputs.access-token }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and Push Docker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ${{ env.dockerfile }}
          push: true
          tags: ${{ env.JF_PUSH_URL }}/${{ env.project-key }}/${{ env.namespace }}/${{ env.app-service }}:${{ github.sha }}-${{ github.run_id }}
          secrets: |
            NPM_TOKEN=${{ steps.jf-saas-setup.outputs.access-token }}

  DeployUIContainerApp:
    name: Deploy UI Container App
    needs: BuildAndPushApplication
    uses: organization/shared-workflows/.github/workflows/containerapp-deploy.yaml@v1
    secrets: inherit
    with:
      subscription-id: ${{ inputs.ENVIRONMENT == 'prod' && 'prod-subscription-id' || 'nonprod-subscription-id' }}
      resource-group: ${{ inputs.ENVIRONMENT == 'prod' && 'sample-prod-rg' || 'sample-dev-rg' }}
      container-app-name: ${{ inputs.ENVIRONMENT == 'prod' && 'sample-ui-prod-app' || 'sample-ui-dev-app' }}
      deploy-mode: image
      registry-image-path: >-
        your-jfrog-registry.example.com/sample-project/sample-ui/${{ inputs.ENVIRONMENT == 'prod' && 'sample-ui-prod-app' || 'sample-ui-dev-app' }}:${{ github.sha }}-${{ github.run_id }}